<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFO Status</title>
<meta name="description" content="Live status of UFO (ufo.alienz.ooo) — checks run in your browser, hosted off Cloudflare so it works during Cloudflare incidents.">
<style>
  :root {
    --bg: #11111b; --card: #1e1e2e; --border: #313244;
    --text: #cdd6f4; --muted: #9399b2; --faint: #6c7086;
    --ok: #a6e3a1; --warn: #f9e2af; --down: #f38ba8; --unknown: #89b4fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 40px 16px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
  h1 .logo { font-size: 26px; }
  .overall {
    margin: 20px 0; padding: 18px 20px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .dot--ok { background: var(--ok); }
  .dot--warn { background: var(--warn); }
  .dot--down { background: var(--down); animation: pulse 1.2s ease-in-out infinite; }
  .dot--unknown { background: var(--unknown); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .grid { display: flex; flex-direction: column; gap: 10px; }
  .row {
    padding: 13px 16px; border-radius: 10px; background: var(--card);
    border: 1px solid var(--border); display: flex; align-items: center; gap: 10px;
  }
  .row .name { font-weight: 600; }
  .row .detail { margin-left: auto; color: var(--muted); font-size: 13px; text-align: right; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 26px 0 10px; }
  .incident {
    padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(249,226,175,.4);
    background: color-mix(in srgb, #f9e2af 8%, var(--card)); margin-bottom: 8px; font-size: 14px;
  }
  .incident .impact { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--warn); margin-right: 8px; }
  .none { color: var(--faint); font-size: 14px; padding: 4px 2px; }
  footer { margin-top: 34px; color: var(--faint); font-size: 12.5px; text-align: center; }
  footer a { color: var(--muted); }
  .updated { color: var(--faint); font-size: 12.5px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1><span class="logo">🛸</span> UFO Status</h1>
  <div class="overall" id="overall"><span class="dot dot--unknown"></span><span>Checking…</span></div>

  <section>
    <h2>Components</h2>
    <div class="grid" id="components"></div>
  </section>

  <section>
    <h2>Cloudflare incidents <span style="text-transform:none;letter-spacing:0">(UFO runs on Cloudflare)</span></h2>
    <div id="incidents" class="none">Checking…</div>
  </section>

  <div class="updated" id="updated"></div>
  <footer>
    Checks run in your browser · hosted off Cloudflare so this page survives Cloudflare incidents<br>
    <a href="https://ufo.alienz.ooo">ufo.alienz.ooo</a> · <a href="https://www.cloudflarestatus.com">cloudflarestatus.com</a>
  </footer>
</main>
<script>
const API = 'https://ufo.alienz.ooo'
const RELEVANT = /worker|durable object|\bd1\b|\br2\b|websocket|pages|network|api/i

const el = (id) => document.getElementById(id)
const row = (name, state, detail) => {
  const cls = state === 'ok' ? 'ok' : state === 'down' ? 'down' : state === 'warn' ? 'warn' : 'unknown'
  const label = state === 'ok' ? 'Operational' : state === 'down' ? 'Down' : state === 'warn' ? 'Degraded' : 'Unknown'
  return `<div class="row"><span class="dot dot--${cls}"></span><span class="name">${name}</span><span class="detail">${detail ?? label}</span></div>`
}

async function fetchTimeout(url, ms = 12000, opts = {}) {
  const ctrl = new AbortController()
  const t = setTimeout(() => ctrl.abort(), ms)
  try { return await fetch(url, { ...opts, signal: ctrl.signal, cache: 'no-store' }) }
  finally { clearTimeout(t) }
}

async function checkUfo() {
  // Full deep read first; if CORS/network blocks it, a no-cors probe still
  // distinguishes "reachable but unreadable" from "unreachable".
  try {
    const resp = await fetchTimeout(`${API}/api/health?deep=1`)
    const body = await resp.json()
    const comp = (v) => v === 'ok' ? 'ok' : 'down'
    const msFor = (k) => body.ms?.[k] != null ? `${body.ms[k]} ms` : null
    return {
      overall: body.ok ? 'ok' : 'down',
      rows: [
        row('Web / API (Worker)', 'ok', 'Operational'),
        row('Database (D1)', comp(body.d1), body.d1 === 'ok' ? msFor('d1') ?? 'Operational' : body.d1),
        row('Realtime & messages (Durable Objects)', comp(body.durable_objects), body.durable_objects === 'ok' ? msFor('durable_objects') ?? 'Operational' : body.durable_objects),
        row('File storage (R2)', comp(body.r2), body.r2 === 'ok' ? msFor('r2') ?? 'Operational' : body.r2),
      ],
    }
  } catch {
    try {
      await fetchTimeout(`${API}/api/health`, 8000, { mode: 'no-cors' })
      return { overall: 'warn', rows: [row('Web / API (Worker)', 'warn', 'Reachable — component detail unavailable')] }
    } catch {
      return { overall: 'down', rows: [row('Web / API (Worker)', 'down', 'Unreachable')] }
    }
  }
}

async function checkCf() {
  try {
    const resp = await fetchTimeout('https://www.cloudflarestatus.com/api/v2/incidents/unresolved.json')
    const data = await resp.json()
    const picked = (data.incidents ?? []).filter(i =>
      i.impact === 'critical' || i.impact === 'major' || (i.impact === 'minor' && RELEVANT.test(i.name ?? '')))
    if (picked.length === 0) { el('incidents').className = 'none'; el('incidents').textContent = 'No relevant unresolved incidents.'; return picked }
    el('incidents').className = ''
    el('incidents').innerHTML = picked.map(i =>
      `<div class="incident"><span class="impact">${i.impact}</span>${i.name} <span style="color:var(--faint)">(${i.status})</span></div>`).join('')
    return picked
  } catch {
    el('incidents').className = 'none'
    el('incidents').textContent = 'Cloudflare status unreachable.'
    return []
  }
}

async function refresh() {
  const [ufo, incidents] = await Promise.all([checkUfo(), checkCf()])
  el('components').innerHTML = ufo.rows.join('')
  const overall = el('overall')
  if (ufo.overall === 'ok') {
    overall.innerHTML = '<span class="dot dot--ok"></span><span>All systems operational</span>'
  } else if (ufo.overall === 'warn') {
    overall.innerHTML = '<span class="dot dot--warn"></span><span>Partially degraded</span>'
  } else {
    const blame = incidents.length > 0 ? ' — likely a Cloudflare incident (see below)' : ''
    overall.innerHTML = `<span class="dot dot--down"></span><span>Service disruption${blame}</span>`
  }
  el('updated').textContent = `Last checked ${new Date().toLocaleTimeString()} · auto-refreshes every 30s`
}

refresh()
setInterval(refresh, 30_000)
</script>
</body>
</html>
